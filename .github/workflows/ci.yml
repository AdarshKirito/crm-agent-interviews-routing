name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  mcp-salesforce:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-salesforce
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mcp-salesforce/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npx tsx --test test/guards.test.ts

  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: Unit tests (live MCP / Gemini tests skip without their env flags)
        run: uv run pytest -q

  search:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: search
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run pytest -q

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m py_compile scripts/*.py
      - run: bash -n scripts/run_systems.sh deploy/start.sh
