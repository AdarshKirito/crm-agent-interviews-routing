# Build the one-container image and deploy it to Cloud Run with keyless auth.
# Infrastructure (service account, APIs, Artifact Registry) comes from
# agent/deployment/terraform/single-project (or `agents-cli infra single-project`).
# Needs vars: GCP_PROJECT_ID, GCP_WIF_PROVIDER, GCP_SERVICE_ACCOUNT, REGION,
#             ARTIFACT_REGISTRY_REPO, RUN_SERVICE_ACCOUNT
# and Secret Manager secrets named salesforce-b2b-username, ... (see README).
name: Deploy to Cloud Run

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "agent/**"
      - "mcp-salesforce/**"
      - "search/**"
      - "Dockerfile"
      - "deploy/**"

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    # skipped until the GCP repo variables are set
    if: vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ vars.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REGISTRY_REPO }}/crmroute:${{ github.sha }}
      SALESFORCE_B2B_USERNAME: ${{ secrets.SALESFORCE_B2B_USERNAME }}
      SALESFORCE_B2B_PASSWORD: ${{ secrets.SALESFORCE_B2B_PASSWORD }}
      SALESFORCE_B2B_SECURITY_TOKEN: ${{ secrets.SALESFORCE_B2B_SECURITY_TOKEN }}
      SALESFORCE_B2C_USERNAME: ${{ secrets.SALESFORCE_B2C_USERNAME }}
      SALESFORCE_B2C_PASSWORD: ${{ secrets.SALESFORCE_B2C_PASSWORD }}
      SALESFORCE_B2C_SECURITY_TOKEN: ${{ secrets.SALESFORCE_B2C_SECURITY_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3

      - uses: astral-sh/setup-uv@v8.0.0
        with:
          python-version: "3.12"

      - name: Export knowledge articles for the search index
        run: uv run --no-project --with simple-salesforce --with python-dotenv python scripts/export_knowledge.py --env /dev/null --out-dir data/knowledge

      - name: Build and push the image
        run: |
          gcloud auth configure-docker "${{ vars.REGION }}-docker.pkg.dev" --quiet
          docker build --build-arg AGENT_VERSION=${{ github.sha }} -t "$IMAGE" .
          docker push "$IMAGE"

      - uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: crmroute
          region: ${{ vars.REGION }}
          image: ${{ env.IMAGE }}
          flags: >-
            --memory=4Gi --cpu=2 --concurrency=8 --timeout=900
            --service-account=${{ vars.RUN_SERVICE_ACCOUNT }}
            --no-allow-unauthenticated
          env_vars: |
            GOOGLE_GENAI_USE_VERTEXAI=true
            GOOGLE_CLOUD_PROJECT=${{ vars.GCP_PROJECT_ID }}
            GOOGLE_CLOUD_LOCATION=global
            OTEL_TO_CLOUD=true
            CRMROUTE_MODE=route
          secrets: |
            SALESFORCE_B2B_USERNAME=salesforce-b2b-username:latest
            SALESFORCE_B2B_PASSWORD=salesforce-b2b-password:latest
            SALESFORCE_B2B_SECURITY_TOKEN=salesforce-b2b-security-token:latest
            SALESFORCE_B2C_USERNAME=salesforce-b2c-username:latest
            SALESFORCE_B2C_PASSWORD=salesforce-b2c-password:latest
            SALESFORCE_B2C_SECURITY_TOKEN=salesforce-b2c-security-token:latest
            GROQ_API_KEY=groq-api-key:latest
