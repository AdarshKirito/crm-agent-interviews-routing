# Runs the 15 fixed CI cases (evals/ci_cases.json) on Gemini 3.1 Flash-Lite through the
# CRMArena-Pro harness and fails if the success or refusal rate drops below
# evals/ci_baseline.json. Needs:
#   vars:    GCP_PROJECT_ID, GCP_WIF_PROVIDER, GCP_SERVICE_ACCOUNT,
#            CRMARENA_JUDGE_MODEL, CRMARENA_JUDGE_PROVIDER
#   secrets: SALESFORCE_B2B_USERNAME/_PASSWORD/_SECURITY_TOKEN, SALESFORCE_B2C_*,
#            OPENAI_API_KEY (only if the judge is an OpenAI model), GROQ_API_KEY (optional)
name: PR eval (15 cases, Flash-Lite)

on:
  pull_request:
    paths:
      - "agent/**"
      - "mcp-salesforce/**"
      - "search/**"
      - "patches/**"
      - "evals/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  eval:
    # skipped until the GCP repo variables are set
    if: vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GOOGLE_GENAI_USE_VERTEXAI: "true"
      GOOGLE_CLOUD_PROJECT: ${{ vars.GCP_PROJECT_ID }}
      GOOGLE_CLOUD_LOCATION: global
      VERTEXAI_PROJECT: ${{ vars.GCP_PROJECT_ID }}
      VERTEXAI_LOCATION: global
      CRMARENA_JUDGE_MODEL: ${{ vars.CRMARENA_JUDGE_MODEL }}
      CRMARENA_JUDGE_PROVIDER: ${{ vars.CRMARENA_JUDGE_PROVIDER }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      SALESFORCE_B2B_USERNAME: ${{ secrets.SALESFORCE_B2B_USERNAME }}
      SALESFORCE_B2B_PASSWORD: ${{ secrets.SALESFORCE_B2B_PASSWORD }}
      SALESFORCE_B2B_SECURITY_TOKEN: ${{ secrets.SALESFORCE_B2B_SECURITY_TOKEN }}
      SALESFORCE_B2C_USERNAME: ${{ secrets.SALESFORCE_B2C_USERNAME }}
      SALESFORCE_B2C_PASSWORD: ${{ secrets.SALESFORCE_B2C_PASSWORD }}
      SALESFORCE_B2C_SECURITY_TOKEN: ${{ secrets.SALESFORCE_B2C_SECURITY_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          python-version: "3.12"

      - name: Benchmark harness (pinned commit + crmroute patch)
        run: |
          GIT_LFS_SKIP_SMUDGE=1 git clone -q https://github.com/SalesforceAIResearch/CRMArena vendor/CRMArena
          cd vendor/CRMArena
          git checkout -q "$(cat ../../patches/crmarena-base-commit.txt)"
          git apply ../../patches/crmarena-crmroute.patch
          uv venv -q --python 3.11 .venv
          uv pip install -q --python .venv -r ../../patches/crmarena-requirements.txt
          uv pip install -q --python .venv -e . --no-deps
          env | grep '^SALESFORCE_' > .env

      - name: Build servers and agent
        run: |
          (cd mcp-salesforce && npm ci && npm run build)
          (cd search && uv sync --locked)
          (cd agent && uv sync --locked)

      - name: Knowledge export and index
        run: |
          vendor/CRMArena/.venv/bin/python scripts/export_knowledge.py --env vendor/CRMArena/.env --out-dir data/knowledge
          search/.venv/bin/crm-knowledge-index --knowledge-dir data/knowledge --qdrant-path data/qdrant

      - name: Start MCP servers and the agent (small model everywhere)
        run: |
          mkdir -p runs/ci/logs
          (cd mcp-salesforce && nohup node dist/index.js --http --port 3333 --env ../vendor/CRMArena/.env > ../runs/ci/logs/mcp_sf.log 2>&1 &)
          (cd search && QDRANT_LOCAL_PATH=../data/qdrant HYBRID_ENABLED=true HYBRID_ONLY=true QDRANT_READ_ONLY=true \
             FASTMCP_SERVER_PORT=8765 nohup .venv/bin/mcp-server-qdrant --transport streamable-http > ../runs/ci/logs/mcp_search.log 2>&1 &)
          (cd agent && CRMROUTE_BIG_MODEL=gemini-3.1-flash-lite CRMROUTE_MODE=no_route \
             nohup .venv/bin/uvicorn app.fast_api_app:app --host 127.0.0.1 --port 8000 > ../runs/ci/logs/agent.log 2>&1 &)
          for i in $(seq 1 90); do curl -sf http://127.0.0.1:8000/list-apps && break; sleep 2; done

      - name: Run the 15 cases
        run: vendor/CRMArena/.venv/bin/python scripts/ci_eval.py run --out runs/ci

      - name: Compare with baseline
        id: compare
        run: vendor/CRMArena/.venv/bin/python scripts/ci_eval.py compare --run runs/ci | tee runs/ci/compare.txt

      - name: Comment on the pull request
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const body = fs.existsSync('runs/ci/compare.txt') ? fs.readFileSync('runs/ci/compare.txt', 'utf8') : 'eval did not finish';
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
              body: '### PR eval (15 cases, Flash-Lite)\n```\n' + body + '\n```'
            });

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-eval
          path: runs/ci
